name: Publish image

# 构建 fnmusic-sources 多架构镜像并推送到 GHCR（amd64 原生 + arm64 原生，无 QEMU）。
# 构建参数与 ci.yml 的 images-multiarch 完全一致，避免"CI 能过、发布镜像不同"。
on:
  push:
    branches: [main]
    paths:
      - "container/**"
      - "musicdl-service/**"
      - "netease-service/**"
      - "lxmusic-service/**"
      - "webui-service/**"
      - "proxy/**"
      - "VERSION"
      - "RELEASE_CHANNEL"
      - ".dockerignore"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=python:3.13-slim
            PIP_INDEX_URL=https://pypi.org/simple
            APT_MIRROR=
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=fnmusic-images-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fnmusic-images-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Compute tags
        id: meta
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          short="${GITHUB_SHA::7}"
          echo "tags=${IMAGE}:latest,${IMAGE}:${version},${IMAGE}:sha-${short}" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(printf '%s\n' ${{ steps.meta.outputs.tags }} | sed 's/^/-t /' | tr '\n' ' ') \
            $(for f in *; do echo "${IMAGE}@sha256:${f}"; done)

      - name: Inspect manifest
        run: docker buildx imagetools inspect "${IMAGE}:latest"
