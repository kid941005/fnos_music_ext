name: Publish slim musicdl images

# 构建两个轻量镜像：
#   :musicdl       仅 musicdl 单源服务（无 WebUI）
#   :musicdl-webui musicdl + WebUI（复用上游 supervisor/entrypoint）
# 都不覆盖完整镜像的 latest。
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.musicdl"
      - "Dockerfile.musicdl-webui"
      - "musicdl-service/**"
      - "webui-service/**"
      - "proxy/**"
      - "container/**"
      - "VERSION"
      - "RELEASE_CHANNEL"
      - ".github/workflows/publish-musicdl.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-musicdl-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build (${{ matrix.target }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: musicdl
            file: Dockerfile.musicdl
          - name: musicdl-webui
            file: Dockerfile.musicdl-webui
        arch:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target.file }}
          platforms: ${{ matrix.arch.platform }}
          build-args: |
            BASE_IMAGE=python:3.13-slim
            PIP_INDEX_URL=https://pypi.org/simple
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=fnmusic-${{ matrix.target.name }}-${{ matrix.arch.arch }}
          cache-to: type=gha,mode=max,scope=fnmusic-${{ matrix.target.name }}-${{ matrix.arch.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target.name }}-${{ matrix.arch.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: musicdl
            health: "8001/healthz"
          - name: musicdl-webui
            health: "8001/healthz 8004/"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.target.name }}-*
          merge-multiple: true
      - name: Compute tags
        id: meta
        run: |
          short="${GITHUB_SHA::7}"
          echo "tags=${IMAGE}:${{ matrix.target.name }} ${IMAGE}:${{ matrix.target.name }}-sha-${short}" >> "$GITHUB_OUTPUT"
      - name: Create multi-arch manifest
        run: |
          args=""
          for t in ${{ steps.meta.outputs.tags }}; do args="$args -t $t"; done
          digests=""
          for f in /tmp/digests/*; do digests="$digests ${IMAGE}@sha256:$(basename "$f")"; done
          echo "creating:$args"
          docker buildx imagetools create $args $digests
      - name: Inspect manifest
        run: docker buildx imagetools inspect "${IMAGE}:${{ matrix.target.name }}"
      - name: Smoke test
        run: |
          name=fnmusic-slim-smoke-${{ matrix.target.name }}
          trap 'docker logs "$name" || true; docker rm -f "$name" || true' EXIT
          docker run -d --name "$name" --platform linux/amd64 "${IMAGE}:${{ matrix.target.name }}"
          for i in $(seq 1 60); do
            ok=1
            for path in ${{ matrix.target.health }}; do
              if ! docker exec "$name" python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+sys.argv[1], timeout=3).status in (200,404) else 1)" "$path" 2>/dev/null; then ok=0; fi
            done
            if [ "$ok" = "1" ]; then echo "smoke ok"; exit 0; fi
            sleep 2
          done
          echo "smoke failed"; exit 1
