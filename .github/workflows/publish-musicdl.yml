name: Publish slim musicdl image

# 只构建 musicdl 单源服务（无 WebUI / 洛雪 / 网易 / Node / ffmpeg），
# 产出 ghcr.io/<repo>:musicdl 与 :musicdl-sha-<short>，不覆盖完整镜像的 latest。
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.musicdl"
      - "musicdl-service/**"
      - ".github/workflows/publish-musicdl.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-musicdl-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.musicdl
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=python:3.13-slim
            PIP_INDEX_URL=https://pypi.org/simple
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=fnmusic-slim-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fnmusic-slim-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - name: Compute tags
        id: meta
        run: |
          short="${GITHUB_SHA::7}"
          echo "tags=${IMAGE}:musicdl ${IMAGE}:musicdl-sha-${short}" >> "$GITHUB_OUTPUT"
      - name: Create multi-arch manifest
        run: |
          args=""
          for t in ${{ steps.meta.outputs.tags }}; do args="$args -t $t"; done
          digests=""
          for f in /tmp/digests/*; do digests="$digests ${IMAGE}@sha256:$(basename "$f")"; done
          echo "creating:$args"
          docker buildx imagetools create $args $digests
      - name: Inspect manifest
        run: docker buildx imagetools inspect "${IMAGE}:musicdl"
      - name: Smoke test
        run: |
          name=fnmusic-slim-smoke
          trap 'docker logs "$name" || true; docker rm -f "$name" || true' EXIT
          docker run -d --name "$name" --platform linux/amd64 "${IMAGE}:musicdl"
          for i in $(seq 1 60); do
            if docker exec "$name" python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3).status==200 else 1)" 2>/dev/null; then
              echo "healthz ok"; exit 0
            fi
            sleep 2
          done
          echo "smoke failed"; exit 1